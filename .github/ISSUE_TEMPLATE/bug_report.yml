name: Bug report
description: Report reproducible incorrect behavior in maze-core.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable code sample, the seed, the maze dimensions, and exact commands.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: maze-core, Node.js, package manager, and operating system.
      placeholder: maze-core 0.2.0; Node 24; pnpm 12; macOS 26
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, the layout or geometry you got, or other useful details.
